services:
  postgres:
    image: postgres:16
    container_name: mlflow-postgres
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow
      POSTGRES_DB: mlflowdb
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ./volumes/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow -d mlflowdb"]
      interval: 5s
      timeout: 3s
      retries: 12

  localstack:
    image: localstack/localstack:3.8.1
    container_name: mlflow-localstack
    environment:
      SERVICES: s3
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "127.0.0.1:4566:4566"
    volumes:
      - ./volumes/localstack:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 3s
      retries: 12

  localstack-init:
    image: amazon/aws-cli:latest
    container_name: mlflow-localstack-init
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    entrypoint:
      - /bin/sh
      - -c
      - aws --endpoint-url=http://localstack:4566 s3 mb s3://mlflow-artifacts || aws --endpoint-url=http://localstack:4566 s3 ls s3://mlflow-artifacts
    restart: "no"

  # LocalStack (community) хранит S3-объекты в памяти, поэтому бакет восстанавливается из s3-seed при каждом старте.
  # Крупный model.pkl (490 МБ) хранится в репозитории через Git LFS (.gitattributes).
  s3-restore:
    image: amazon/aws-cli:latest
    container_name: mlflow-s3-restore
    depends_on:
      localstack-init:
        condition: service_completed_successfully
    volumes:
      - ./s3-seed:/seed:ro
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      # Новые aws-cli по умолчанию шлют чексумму CRC64NVME, которую LocalStack 3.8 не принимает.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
    entrypoint:
      - /bin/sh
      - -c
      - 'aws --endpoint-url=http://localstack:4566 s3 cp --recursive /seed/mlflow s3://mlflow-artifacts/mlflow && echo "S3 restore done: 85 objects"'
    restart: "no"
